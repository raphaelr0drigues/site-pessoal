<!DOCTYPE html> 
<html lang="pt-br"> 
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="site-header">
        <button id="theme-toggle" class="theme-btn">Alternar Tema</button>
        <nav class="menu" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
                <li><a href="formulario.html">Formulário</a></li>
                <li><a href="multimidia.html">Multimídia</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
            </ul>
        </nav>
        <h1>Formulário de Contato</h1>
    </header>
    
    <main class="form-grid">
        <div class="cartao">
            <form> 
                <div id="form-feedback" class="feedback-message"></div>
                <fieldset> 
                    <legend>Dados pessoais</legend> 
                    <label for="nome">Nome:</label> 
                    <input type="text" id="nome" required> 
                    <label for="email">E-mail:</label> 
                    <input type="email" id="email" required>
                    <label for="assunto">Assunto:</label>
                    <input type="text" id="assunto" required>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" required></textarea>
                    <label for="tel">Telefone:</label> 
                    <input type="tel" id="tel" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}"> 
                    <label for="nasc">Nascimento:</label> 
                    <input type="date" id="nasc"> 
                    <label for="senha">Senha:</label> 
                    <input type="password" id="senha" required minlength="8"> 
                </fieldset> 
                <button type="submit">Enviar</button> 
            </form> 
        </div>
    </main>

    <footer style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #777;">
        <p><em>Feito por Raphael Rodrigues — 2026</em></p>
    </footer>
    <script src="js/scripts.js"></script>
</body> 
</html>
