<!DOCTYPE html>  
<html lang="pt-br">  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="site-header">
        <button id="theme-toggle" class="theme-btn">Alternar Tema</button>
        <nav class="menu" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
                <li><a href="formulario.html">Formulário</a></li>
                <li><a href="multimidia.html">Multimídia</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
            </ul>
        </nav>
        <h1>Gráficos e Desenhos</h1>
    </header>

    <main class="charts-grid">
        <section class="cartao" style="text-align: center;">
            <h2>Desenho em Canvas</h2>
            <canvas id="meuCanvas" width="300" height="200" style="border:1px solid #000;"></canvas>
            <script>
            let tela = document.getElementById("meuCanvas");
            let pincel = tela.getContext("2d");
            pincel.fillStyle = "blue";
            pincel.fillRect(50, 20, 150, 100);
            </script>
        </section>

        <section class="cartao" style="text-align: center;">
            <h2>Desenho em SVG</h2>
            <svg width="200" height="200">
                <circle cx="100" cy="100" r="60" class="meu-vetor" />
            </svg>
        </section>
    </main>

    <footer style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #777;">
        <p><em>Feito por Raphael Rodrigues — 2026</em></p>
    </footer>
    <script src="js/scripts.js"></script>
</body>
</html>
